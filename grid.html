<title>Design Worlds Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0b0b0d;
    --surface:#151519;
    --surface-2:#1d1d22;
    --edge:rgba(255,255,255,0.09);
    --edge-strong:rgba(255,255,255,0.22);
    --text:#f3f1ea;
    --text-muted:#9c988e;
    --text-faint:#6b675e;
    --accent:#8a7350;
    --accent-ink:#f8f3e9;
    color-scheme: dark;

    --mood-bg: var(--bg);
    --mood-text: var(--text);
    --mood-sub: var(--text-muted);
  }

  *{box-sizing:border-box;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:"Manrope", "Segoe UI", sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  h1,h2{ text-wrap:balance; margin:0; }

  .stage{
    background: var(--mood-bg);
    transition: background 700ms ease;
    padding-block: clamp(28px,6vw,56px) clamp(32px,6vw,64px);
    padding-inline: 20px;
    position:relative;
    overflow:hidden;
  }
  .motif{
    position:absolute; inset:0;
    opacity:0;
    transition: opacity 700ms ease;
    pointer-events:none;
  }
  .motif.on{ opacity:1; }

  .stage-inner{ max-width:1080px; margin-inline:auto; position:relative; z-index:1; }

  .back{
    display:inline-flex; align-items:center; gap:6px;
    font-size:12.5px; color: var(--mood-sub);
    background: rgba(255,255,255,0.06);
    border:1px solid var(--edge);
    padding:7px 13px; border-radius:999px;
    text-decoration:none;
    margin-bottom:18px;
    transition: color 700ms ease, border-color 200ms ease;
  }
  .back:hover{ border-color: var(--edge-strong); }

  .eyebrow{
    font-size:12px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    color: var(--mood-sub);
    font-weight:600;
    transition: color 700ms ease;
  }
  .headline{
    font-family:"Fraunces", Georgia, serif;
    font-weight:500;
    font-size: clamp(30px, 5.6vw, 54px);
    letter-spacing:-0.01em;
    color: var(--mood-text);
    margin-top:6px;
    transition: color 700ms ease;
  }
  .sub{
    font-size:14.5px; line-height:1.55;
    color: var(--mood-sub);
    margin-top:10px;
    max-width:520px;
    transition: color 700ms ease;
  }

  .grid{
    margin-top: clamp(28px,5vw,44px);
    display:grid;
    grid-template-columns: repeat(3, 1fr);
    grid-auto-rows: 250px;
    gap:14px;
  }
  @media (max-width:860px){
    .grid{ grid-template-columns: repeat(2, 1fr); }
  }
  @media (max-width:520px){
    .grid{ grid-template-columns: 1fr; grid-auto-rows: 230px; }
    .card.selected{ grid-column: span 1 !important; }
  }

  .card{
    position:relative;
    border-radius:16px;
    overflow:hidden;
    cursor:pointer;
    border:1px solid var(--edge);
    background:var(--surface);
    transition: border-color 240ms ease, box-shadow 320ms ease, transform 220ms ease;
  }
  .card:hover{ transform: scale(1.025); z-index:2; }
  .card.month{
    border-color: rgba(138,115,80,0.55);
  }
  .card.selected{
    grid-column: span 2;
    grid-row: span 2;
    z-index:2;
    border-color: var(--accent);
    box-shadow: 0 0 0 1px var(--accent), 0 20px 48px rgba(0,0,0,0.45);
  }
  .card.selected:hover{ transform:none; }
  .card.month.selected{
    box-shadow: 0 0 0 1.5px var(--accent), 0 20px 48px rgba(0,0,0,0.45);
  }

  .card-media{
    position:absolute; inset:0;
    background-size:cover;
    background-position:center;
    transition: transform 500ms ease;
  }
  .card:hover .card-media{ transform: scale(1.06); }

  .card-scrim{
    position:absolute; inset:0;
    background: linear-gradient(180deg, rgba(0,0,0,0.02) 0%, rgba(0,0,0,0.1) 40%, rgba(0,0,0,0.78) 100%);
  }

  .card-body{
    position:absolute; left:0; right:0; bottom:0;
    padding:20px;
  }
  .card-kicker{
    font-size:11px; letter-spacing:0.14em; text-transform:uppercase;
    color:#d9cfbb; font-weight:600;
  }
  .card.month .card-kicker{
    color:#e8caa0;
    font-style:italic;
    letter-spacing:0.16em;
  }
  .card-name{
    font-family:"Fraunces", Georgia, serif;
    color:#fff; font-size:23px; line-height:1.18;
    margin-top:5px; font-weight:500;
  }
  .card.selected .card-name{ font-size:27px; }

  .card-hint{
    font-size:13px; line-height:1.5;
    color:#e6e2d6;
    margin-top:8px;
    max-height:0; opacity:0;
    overflow:hidden;
    transition: max-height 260ms ease, opacity 220ms ease, margin-top 260ms ease;
  }
  .card:hover:not(.selected) .card-hint{
    max-height:60px; opacity:1;
  }

  .card-info{
    font-size:13.5px; line-height:1.55;
    color:#e6e2d6;
    margin-top:10px;
    max-width:420px;
    max-height:0; opacity:0;
    overflow:hidden;
    transition: max-height 300ms ease 220ms, opacity 320ms ease 240ms, margin-top 300ms ease 220ms;
  }
  .card.selected .card-info{
    max-height:160px; opacity:1;
  }
  .card-cta{
    display:inline-block;
    margin-top:10px;
    font-size:12.5px;
    letter-spacing:0.03em;
    color:#e8caa0;
    font-weight:600;
    text-decoration:none;
    opacity:0;
    transition: opacity 280ms ease 380ms;
  }
  .card.selected .card-cta{ opacity:1; }
  .card-cta::after{ content:" →"; }

  .teaser{
    max-width:1080px;
    margin: 0 auto 64px;
    padding: 0 20px;
  }
  .teaser-card{
    background: var(--surface-2);
    border:1px solid var(--edge);
    border-radius:16px;
    padding: 26px 24px;
    max-height:0; opacity:0; overflow:hidden;
    padding-top:0; padding-bottom:0;
    transition: max-height 320ms ease, opacity 280ms ease, padding 320ms ease;
    margin-top:24px;
  }
  .teaser-card.open{
    max-height:200px; opacity:1;
    padding-top:26px; padding-bottom:26px;
  }
  .teaser-eyebrow{ font-size:11px; letter-spacing:0.1em; text-transform:uppercase; color:var(--accent); font-weight:600; }
  .teaser-title{ font-family:"Fraunces", Georgia, serif; font-size:20px; margin-top:4px; }
  .teaser-sub{ font-size:13px; color:var(--text-faint); margin-top:6px; max-width:480px; }
</style>

<section class="stage" id="stage">
  <div class="motif" id="motif"></div>
  <div class="stage-inner">
    <a class="back" href="landing.html">← Startseite</a>
    <p class="eyebrow">Brauchst du Inspiration?</p>
    <h1 class="headline">Curated Design Worlds</h1>
    <p class="sub">Alle Design-Welten auf einen Blick. Wähle eine Kachel, um dich hineinzufühlen – ein zweiter Klick öffnet die Stilwelt.</p>

    <div class="grid" id="grid"></div>

    <div class="teaser">
      <div class="teaser-card" id="teaserCard">
        <p class="teaser-eyebrow">Nächster Schritt</p>
        <p class="teaser-title" id="teaserTitle"></p>
        <p class="teaser-sub">Hier entsteht die Stilwelt-Detailseite: Showroom mit Hotspots, Marken & Ikonen, Produkte.</p>
      </div>
    </div>
  </div>
</section>

<script>
(function(){
  var motifs = {
    bauhaus: '<svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="70" cy="80" r="46" fill="none" stroke="#d64545" stroke-width="1.4" opacity="0.35"/>' +
      '<rect x="270" y="40" width="70" height="70" fill="none" stroke="#3f63c9" stroke-width="1.4" opacity="0.35"/>' +
      '<polygon points="220,300 260,370 180,370" fill="none" stroke="#e0b13a" stroke-width="1.4" opacity="0.35"/>' +
      '<line x1="0" y1="200" x2="400" y2="200" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>' +
      '<line x1="200" y1="0" x2="200" y2="400" stroke="#ffffff" stroke-width="0.5" opacity="0.08"/>' +
      '</svg>',
    midcentury: '<svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<circle cx="200" cy="90" r="3" fill="#d9b190" opacity="0.5"/>' +
      '<g opacity="0.28" stroke="#d9b190" stroke-width="1.4" fill="none">' +
      '<line x1="200" y1="90" x2="200" y2="40"/><line x1="200" y1="90" x2="245" y2="55"/>' +
      '<line x1="200" y1="90" x2="255" y2="90"/><line x1="200" y1="90" x2="245" y2="125"/>' +
      '<line x1="200" y1="90" x2="200" y2="140"/><line x1="200" y1="90" x2="155" y2="125"/>' +
      '<line x1="200" y1="90" x2="145" y2="90"/><line x1="200" y1="90" x2="155" y2="55"/>' +
      '</g>' +
      '<path d="M40,340 Q120,300 180,340 T340,330" fill="none" stroke="#d9b190" stroke-width="1.2" opacity="0.25"/>' +
      '</svg>',
    scandi: '<svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<g opacity="0.3" stroke="#68676c" stroke-width="1.3" fill="none">' +
      '<path d="M150,120 h100 M160,120 v90 M240,120 v90 M160,210 h80 M160,145 h80 M170,210 v40 M230,210 v40"/>' +
      '</g>' +
      '<g opacity="0.14" stroke="#68676c" stroke-width="1">' +
      '<polygon points="30,30 55,50 30,70 5,50" fill="none"/>' +
      '<polygon points="370,330 395,350 370,370 345,350" fill="none"/>' +
      '</g>' +
      '</svg>',
    japandi: '<svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<path d="M120,220 C120,160 170,120 230,130 C290,140 310,200 280,240 C250,280 180,285 145,255 C128,240 120,232 120,220 Z" ' +
      'fill="none" stroke="#adbfa0" stroke-width="2" opacity="0.3" stroke-linecap="round"/>' +
      '</svg>',
    artdeco: '<svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<g opacity="0.3" stroke="#d9c07a" stroke-width="1.3" fill="none">' +
      '<path d="M200,60 L215,110 L265,110 L225,140 L240,190 L200,160 L160,190 L175,140 L135,110 L185,110 Z"/>' +
      '</g>' +
      '<g opacity="0.16" stroke="#d9c07a" stroke-width="1">' +
      '<circle cx="200" cy="300" r="70"/><circle cx="200" cy="300" r="55"/><circle cx="200" cy="300" r="40"/>' +
      '</g>' +
      '</svg>',
    industrial: '<svg width="100%" height="100%" viewBox="0 0 400 400" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">' +
      '<g opacity="0.28" stroke="#9a978f" stroke-width="1.2" fill="none">' +
      '<circle cx="90" cy="90" r="26"/><circle cx="90" cy="90" r="6"/>' +
      '<circle cx="310" cy="300" r="34"/><circle cx="310" cy="300" r="8"/>' +
      '<line x1="90" y1="120" x2="90" y2="260"/><line x1="60" y1="150" x2="120" y2="150"/>' +
      '</g>' +
      '<g opacity="0.1" stroke="#9a978f" stroke-width="0.6">' +
      '<line x1="0" y1="60" x2="400" y2="60"/><line x1="0" y1="340" x2="400" y2="340"/>' +
      '</g>' +
      '</svg>'
  };

  var styles = [
    {
      id:"bauhaus", isMonth:true, kicker:"Stil des Monats", name:"Bauhaus",
      img:"bauhaus.webp",
      mood:{ bg:"#12172a", text:"#f3f1ea", sub:"#a9b0cc" },
      hint:"Stahlrohr, klare Geometrie, Funktion vor Ornament.",
      brief:"Klare Linien, Stahlrohr, Funktion vor Ornament. Diesen Monat im Fokus: die radikale Formsprache der Bauhaus-Schule.",
      detailUrl:"detail.html"
    },
    {
      id:"midcentury", isMonth:false, kicker:"Design-Welt", name:"Mid-Century Modern",
      img:"midcentury.webp",
      mood:{ bg:"#2b1c14", text:"#f7ece2", sub:"#d9b190" },
      hint:"Eiche, Terrakotta und Salbeigrün im Dialog.",
      brief:"Eiche, Terrakotta und Salbeigrün im Dialog. Die Nachkriegsmoderne der 1950er und 60er Jahre, warm und organisch."
    },
    {
      id:"scandi", isMonth:false, kicker:"Design-Welt", name:"Scandinavian Functionalism",
      img:"scandi.webp",
      mood:{ bg:"#e7e5e0", text:"#26262a", sub:"#68676c" },
      hint:"Verchromtes Stahlrohr, viel Licht, reduzierte Formen.",
      brief:"Verchromtes Stahlrohr, viel Licht, reduzierte Formen. Funktion und Klarheit im Gleichgewicht – der skandinavische Alltag als Vorbild."
    },
    {
      id:"japandi", isMonth:false, kicker:"Design-Welt", name:"Japandi & Craftsmanship",
      img:"japandi.webp",
      mood:{ bg:"#1c231c", text:"#eef0e4", sub:"#adbfa0" },
      hint:"Naturholz, Waldnähe, sichtbares Handwerk.",
      brief:"Wabi-Sabi trifft Skandinavien. Naturholz, Waldnähe, ruhige Flächen und sichtbares Handwerk."
    },
    {
      id:"artdeco", isMonth:false, kicker:"Design-Welt", name:"Art Déco",
      img:null, swatch:"linear-gradient(155deg,#20180a 0%,#332510 55%,#4a3618 100%)",
      mood:{ bg:"#1c1408", text:"#f5ecd6", sub:"#c9b27f" },
      hint:"Symmetrie, Messing, gestufte Formen und Samt.",
      brief:"Symmetrie, Messing und gestufte Formen. Der glamouröse Aufbruch der 1920er Jahre, in Samt und satten Farben."
    },
    {
      id:"industrial", isMonth:false, kicker:"Design-Welt", name:"Industrial Loft",
      img:null, swatch:"linear-gradient(155deg,#2a2a2c 0%,#3a3a3d 55%,#4d4d51 100%)",
      mood:{ bg:"#232326", text:"#eeeeee", sub:"#a8a8ac" },
      hint:"Rohstahl, sichtbare Nieten, Loft-Charakter.",
      brief:"Rohstahl, sichtbare Nieten, unverputzte Flächen. Loft-Charakter zwischen Fabrikhalle und Wohnraum."
    }
  ];

  var selectedId = "bauhaus";

  var gridEl = document.getElementById("grid");
  var stageEl = document.getElementById("stage");
  var motifEl = document.getElementById("motif");
  var teaserCard = document.getElementById("teaserCard");
  var teaserTitle = document.getElementById("teaserTitle");

  function styleById(id){
    for (var i=0;i<styles.length;i++){ if(styles[i].id===id) return styles[i]; }
    return styles[0];
  }

  function captureRects(){
    var rects = {};
    Array.prototype.forEach.call(gridEl.children, function(el){
      rects[el.getAttribute("data-id")] = el.getBoundingClientRect();
    });
    return rects;
  }

  function playFlip(firstRects){
    Array.prototype.forEach.call(gridEl.children, function(el){
      var id = el.getAttribute("data-id");
      var first = firstRects[id];
      if (!first) return;
      var last = el.getBoundingClientRect();
      var dx = first.left - last.left;
      var dy = first.top - last.top;
      var sx = first.width / last.width;
      var sy = first.height / last.height;
      if (Math.abs(dx) < 0.5 && Math.abs(dy) < 0.5 && Math.abs(sx-1) < 0.01 && Math.abs(sy-1) < 0.01) return;
      el.style.transformOrigin = "top left";
      el.style.transition = "none";
      el.style.transform = "translate(" + dx + "px," + dy + "px) scale(" + sx + "," + sy + ")";
      el.getBoundingClientRect();
      requestAnimationFrame(function(){
        el.style.transition = "transform 420ms cubic-bezier(.22,.8,.28,1)";
        el.style.transform = "none";
      });
      el.addEventListener("transitionend", function handler(){
        el.style.transition = "";
        el.style.transformOrigin = "";
        el.removeEventListener("transitionend", handler);
      });
    });
  }

  function renderGrid(){
    gridEl.innerHTML = "";
    styles.forEach(function(s){
      var card = document.createElement("div");
      card.setAttribute("data-id", s.id);
      card.className = "card" + (s.isMonth ? " month" : "") + (s.id===selectedId ? " selected" : "");
      var mediaStyle = s.img ? ('background-image:url(' + s.img + ')') : ('background-image:' + s.swatch);
      card.innerHTML =
        '<div class="card-media" style="' + mediaStyle + '"></div>' +
        '<div class="card-scrim"></div>' +
        '<div class="card-body">' +
          '<p class="card-kicker">' + s.kicker + '</p>' +
          '<p class="card-name">' + s.name + '</p>' +
          '<p class="card-hint">' + s.hint + '</p>' +
          '<p class="card-info">' + s.brief + '</p>' +
          (s.detailUrl
            ? '<a class="card-cta" href="' + s.detailUrl + '">Interessiert?</a>'
            : '<span class="card-cta">Interessiert?</span>') +
        '</div>';
      card.addEventListener("click", function(){ handleClick(s.id); });
      gridEl.appendChild(card);
    });
  }

  function applyMood(s){
    stageEl.style.setProperty("--mood-bg", s.mood.bg);
    stageEl.style.setProperty("--mood-text", s.mood.text);
    stageEl.style.setProperty("--mood-sub", s.mood.sub);
    motifEl.innerHTML = motifs[s.id] || "";
    motifEl.classList.add("on");
  }

  function handleClick(id){
    if (selectedId === id){
      var current = styleById(id);
      if (current.detailUrl) return;
      openTeaser(id);
      return;
    }
    var firstRects = captureRects();
    selectedId = id;
    var s = styleById(id);
    applyMood(s);
    closeTeaser();
    renderGrid();
    playFlip(firstRects);
  }

  function openTeaser(id){
    var s = styleById(id);
    teaserTitle.textContent = s.name + " entdecken";
    teaserCard.classList.add("open");
  }
  function closeTeaser(){ teaserCard.classList.remove("open"); }

  var initial = styleById(selectedId);
  applyMood(initial);
  renderGrid();
})();
</script>
